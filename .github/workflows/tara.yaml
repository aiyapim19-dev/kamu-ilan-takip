name: Ilanlari tara

on:
  schedule:
    - cron: "7 * * * *" # her saat başı, 7. dakikada
  workflow_dispatch: # elle çalıştırma düğmesi

permissions:
  contents: write

concurrency:
  group: tara
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Paketleri kur
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Siteleri tara
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ vars.APP_URL }}
        run: python scraper/scrape.py

      - name: Sonucu kaydet
        run: |
          git config user.name "ilan-bot"
          git config user.email "ilan-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Ilanlar guncellendi" && git push)
